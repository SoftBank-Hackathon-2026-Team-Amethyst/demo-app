# App Chart 값 (모든 배포 대상 공통). 대상별 차이는 deploy/<대상>/ 에 둔다.
image:
  repository: ghcr.io/softbank-hackathon-2026-team-amethyst/demo-app-fe
  tag: ""

containerPort: 3000
podNamespaceEnv: true
replicas: 1
autoscaling:
  enabled: false
metrics:
  enabled: true
  port: 4040
  nginxLogExporter:
    enabled: true

probe:
  path: /

# nginx 정적 서빙 + 프록시는 차트 기본값(128Mi/256Mi)이 과하다 (트래픽 분석).
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 64Mi

# 외부 노출은 FE만 한다 (BE는 FE nginx가 클러스터 안에서 프록시). onprem은 deploy/onprem/values.yaml에서 끈다.
ingress:
  enabled: true
  # 차트 기본 /health는 nginx가 BE로 프록시하므로 FE 자체 상태가 아니다. ALB 타깃 헬스는 정적 루트로 본다.
  healthcheckPath: /

# 승인자용 green 미리보기 (platform ADR 0015). Identity Center SSO로 로그인한 승인자만 green을 연다.
# 호스트는 deploy.yml의 preview-host가 대상 · 환경별로 넣는다. 대상별 시크릿 · Ingress 설정은 deploy/<대상>/values.yaml에 있다.
# 값은 infra/envs/aws 출력 preview_auth에서 온다.
previewAuth:
  enabled: true
  issuerUrl: https://cognito-idp.ap-northeast-2.amazonaws.com/ap-northeast-2_tX5SjFeTO
  remoteKey: arn:aws:secretsmanager:ap-northeast-2:993371732872:secret:demo-app-preview-oauth2-proxy-Aiie4k
  # nginx는 /api/를 active BE(demo-app-be)로 프록시한다. green 화면에서는 oauth2-proxy가 /api/를 green BE로 바로 보낸다.
  # App Chart v2.4.0부터 적용된다. 그 전 차트는 이 값을 무시한다.
  routes:
    - path: /api/
      service: demo-app-be-preview
      port: 8000
