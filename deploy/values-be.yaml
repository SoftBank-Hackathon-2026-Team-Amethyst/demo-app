# App Chart 값 (모든 배포 대상 공통). 대상별 차이는 deploy/<대상>/ 에 둔다.
image:
  repository: ghcr.io/softbank-hackathon-2026-team-amethyst/demo-app-be
  tag: ""

containerPort: 8000
replicas: 2
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
# CPU 비율의 분모를 고정한다. 세부 용량 튜닝은 부하 측정 후 조정한다.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
metrics:
  enabled: true
  port: 8000
# FE nginx가 demo-app-be:8000으로 프록시한다.
service:
  port: 8000

env:
  APP_VERSION: v2.1.1
  # CPU 부하 테스트는 test · prod에서 같은 플래그로 제어한다. false면 CPU 연산 API가 등록되지 않는다.
  LOAD_TEST_ENABLED: "true"
  # 클라우드 DB(RDS · Cloud SQL)는 TLS 없는 접속을 거부한다. BE가 이 값을 postgres.js ssl 옵션으로 넘긴다 (T28).
  # 온프레미스 Postgres도 TLS를 켜 두었으므로(platform database/onprem) 세 대상이 같은 값을 쓴다.
  PGSSL: require
  # 피크 약 260 req/s에서 요청당 2줄 info 로그는 CloudWatch 비용 · CPU만 쓴다 (트래픽 분석).
  LOG_LEVEL: warn
  # 장애 주입(CHAOS_ENABLED) 같은 test 전용 값은 values-be.test.yaml에만 둔다. prod에는 그 경로가 열리지 않는다 (T35).
envFromSecrets:
  - demo-app-db

probe:
  path: /health

migration:
  enabled: true
  secretName: demo-app-db
