# 공통 서비스 값에 GKE 설정만 덧붙인다.
service:
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
ingress:
  className: ""
  annotations:
    kubernetes.io/ingress.class: gce
env:
  PGSSL: require
  REGION: asia-northeast3
# 승인자용 green 미리보기 (platform ADR 0015, T38). FE에서만 켜진다(values-fe.yaml). 인증은 aws Cognito를 그대로 쓴다.
# 시크릿 · 고정 IP는 infra/envs/gcp, 호스트 DNS는 infra/envs/aws(gcp_preview_hosts)가 만든다. App Chart v2.16.0 이상.
previewAuth:
  remoteKey: demo-app-preview-oauth2-proxy
  ingress:
    managedCertificate: true
    annotations:
      kubernetes.io/ingress.global-static-ip-name: "demo-app-green-{{ .Release.Namespace }}"
      kubernetes.io/ingress.allow-http: "false"
