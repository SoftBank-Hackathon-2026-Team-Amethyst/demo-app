# 공통 서비스 값에 GKE 설정만 덧붙인다.
service:
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
ingress:
  className: ""
  annotations:
    kubernetes.io/ingress.class: gce
env:
  PGSSL: require
  REGION: asia-northeast3
# 승인자용 green 미리보기는 aws에서만 켠다. IdP 연결과 시크릿 경로가 정해지기 전까지 끈다 (platform ADR 0015).
previewAuth:
  enabled: false
