# 온프레미스 공통 덮어쓰기. 외부 노출은 Cloudflare Tunnel이 Service로 바로 연결하므로 Ingress를 쓰지 않는다.
ingress:
  enabled: false
replicas: 1
autoscaling:
  enabled: false
# 승인자용 green 미리보기 (platform ADR 0015). FE에서만 켜진다(values-fe.yaml). 보조 기기는 deploy.yml의 preview-auth로 끈다.
# oauth2-proxy 비밀값은 platform 네임스페이스 Secret에서 가져온다(onprem cloud-secrets는 Kubernetes provider).
# 키: OAUTH2_PROXY_CLIENT_ID, OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET (값은 AWS의 같은 시크릿과 같다)
previewAuth:
  remoteKey: demo-app-preview-oauth2-proxy
