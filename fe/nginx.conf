log_format metrics '$request_method $status $body_bytes_sent $request_time';
map $http_user_agent $record_metrics {
    default 1;
    ~^kube-probe/ 0;
    ~^ELB-HealthChecker/ 0;
    ~^GoogleHC/ 0;
    one-tatchi-smoke 0;
}

server {
    listen 3000;
    server_name localhost;
    access_log /dev/stdout combined;
    access_log syslog:server=127.0.0.1:5531,tag=nginx metrics if=$record_metrics;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Resolve at request time: an unavailable observer must not prevent nginx startup.
    resolver ${RUNTIME_DNS_RESOLVER} valid=10s ipv6=off;
    location = /api/runtime {
        set $runtime_status "runtime-status.${POD_NAMESPACE}.svc.cluster.local:8080";
        proxy_pass http://$runtime_status/api/runtime;
        proxy_connect_timeout 2s;
        proxy_read_timeout 4s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # Proxy to backend service in containerized/k8s environments
    location /api/ {
        proxy_pass http://demo-app-be:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://demo-app-be:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
