name: rollout

# Blue-Green 승격 · 취소 · 되돌리기. Slack 봇(배포하는 우사기)의 버튼이나 /rollout 명령이 실행한다 (T26).
# 본문은 one-tatchi-platform의 재사용 워크플로이고, 여기서는 대상 · 환경을 클러스터 · 네임스페이스로 바꿔 넘긴다.
on:
  workflow_dispatch:
    inputs:
      action: { type: choice, options: [promote, abort, undo], required: true }
      release: { description: "서비스 이름 또는 all", type: string, default: all }
      target: { type: choice, options: [aws, gcp, onprem, onprem-secondary], default: aws }
      environment: { type: choice, options: [test, prod], default: test }
      requested_by: { description: "버튼을 누른 Slack 사용자 (감사 로그)", type: string, required: false }

permissions:
  contents: read
  id-token: write

jobs:
  rollout:
    uses: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform/.github/workflows/rollout.yml@v2.0.1
    with:
      action: ${{ inputs.action }}
      release: ${{ inputs.release }}
      services: demo-app-be demo-app-fe
      target: ${{ startsWith(inputs.target, 'onprem') && 'onprem' || inputs.target }}
      target-label: ${{ inputs.target }}
      onprem-runner-label: ${{ inputs.target == 'onprem-secondary' && 'onprem-secondary' || 'onprem' }}
      environment: ${{ inputs.environment }}
      cluster: ${{ inputs.target == 'aws' && 'one-tatchi' || inputs.target == 'gcp' && vars.GCP_CLUSTER || inputs.target == 'onprem-secondary' && (vars.ONPREM_SECONDARY_CLUSTER || 'missing-onprem-secondary-cluster') || vars.ONPREM_CLUSTER || 'k3d-onetouch' }}
      namespace: ${{ inputs.environment }}
      requested-by: ${{ inputs.requested_by }}
      template-ref: v2.0.1
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
