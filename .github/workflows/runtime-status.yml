name: runtime-status
on:
  pull_request:
    paths: ["fe/**", "deploy/values-fe.yaml", ".github/workflows/runtime-status.yml"]
  push:
    branches: [main]
    paths: ["fe/**", "deploy/values-fe.yaml", ".github/workflows/runtime-status.yml"]
permissions:
  contents: read
jobs:
  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: fe/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml
      - name: Runtime Pod card regression tests
        working-directory: fe
        run: pnpm install --frozen-lockfile && pnpm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: fe
          load: true
          tags: demo-app-fe:runtime-ci
          cache-from: type=gha,scope=runtime-fe
          cache-to: type=gha,mode=max,scope=runtime-fe
      - name: Read-only nginx startup without Runtime Status DNS
        run: |
          docker run --rm --read-only --tmpfs /tmp --add-host demo-app-be:127.0.0.1 \
            -e POD_NAMESPACE=test demo-app-fe:runtime-ci nginx -c /tmp/runtime-nginx.conf -t
