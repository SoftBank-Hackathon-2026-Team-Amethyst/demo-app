name: deploy

# 검사 → test → prod. 본문은 one-tatchi-platform의 재사용 워크플로이고, 여기서는 입력만 넘긴다.
# - pull_request: 검사만
# - push yolo/**: 검사 → test (AI 승격 판단을 바로 실행)
# - push main:    검사 → test → prod (test 값만 바꾸면 prod 생략, 운영 승인은 compliance)
# - workflow_dispatch(main): 대상 하나를 골라 검사 → test → prod를 다시 실행
# push 배포 대상은 레포 변수 DEPLOY_TARGET(aws | gcp | onprem, 기본 aws)으로 고른다.
on:
  pull_request:
  push:
    branches: [main, "yolo/**"]
  workflow_dispatch:
    inputs:
      target:
        description: 다시 배포할 대상
        required: true
        type: choice
        options: [aws, gcp, onprem, onprem-secondary]
      environment:
        description: 다시 배포할 환경 (test는 test만, prod는 test 검증 후 prod)
        type: choice
        default: prod
        options: [test, prod]
      verify-observability:
        description: T17 실측 (main · test 전용, 새 green에서 검증 후 정리)
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  id-token: write   # 감사 로그(S3)용 OIDC
  packages: write   # onprem 이미지(GHCR) push

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: 배포 대상 분기 회귀 검사
        run: npm ci --prefix .github/tests --ignore-scripts && npm test --prefix .github/tests
      - name: 수동 실측 요청 확인
        env:
          VERIFY: ${{ inputs.verify-observability || false }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$VERIFY" = true ]; then
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_REF" != refs/heads/main ] || [ "$ENVIRONMENT" != test ]; then
              echo '::error::T17 verification requires workflow_dispatch on main with environment=test'
              exit 1
            fi
          fi
  # 인프라 · 템플릿 버전만 바뀌었을 때 기본 AWS 앱을 다시 배포하지 않는다.
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      common: ${{ steps.paths.outputs.common }}
      prod_common: ${{ steps.paths.outputs.prod_common }}
      aws: ${{ steps.paths.outputs.aws }}
      gcp: ${{ steps.paths.outputs.gcp }}
      onprem: ${{ steps.paths.outputs.onprem }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            common:
              - 'be/**'
              - 'fe/**'
              - 'db/**'
              - 'deploy/values-*.yaml'
            # paths-filter는 OR 매칭이다. 별도 부정 패턴 대신 extglob으로 test 값만 제외한다.
            prod_common:
              - 'be/**'
              - 'fe/**'
              - 'db/**'
              - 'deploy/values-!(*.test).yaml'
            aws:
              - 'deploy/aws/**'
            gcp:
              - 'deploy/gcp/**'
            onprem:
              - 'deploy/onprem/**'
  checks:
    uses: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform/.github/workflows/checks.yml@v2.17.0
    with:
      template-ref: v2.17.0
      node-dirs: '["be", "fe"]'
      python-dirs: '[]'
      db-init: db/init.sql
      image-dirs: '["be", "fe"]'
      iac-path: infra
    secrets: inherit

  # PR 검사가 통과하면 Slack에 "PR 준비" 알림과 머지 버튼 (T26)
  pr-ready:
    needs: checks
    if: github.event_name == 'pull_request'
    uses: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform/.github/workflows/pr-ready.yml@v2.17.0
    with:
      template-ref: v2.17.0
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  test:
    needs: [checks, changes, request]
    if: >-
      always() && !cancelled() && needs.checks.result == 'success' && needs.request.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' && needs.changes.result == 'success' &&
        (needs.changes.outputs.common == 'true' ||
         needs.changes.outputs[startsWith(inputs.target || vars.DEPLOY_TARGET || 'aws', 'onprem') && 'onprem' || (inputs.target || vars.DEPLOY_TARGET || 'aws')] == 'true')))
    uses: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform/.github/workflows/deploy.yml@v2.17.0
    with:
      target: ${{ startsWith(inputs.target || vars.DEPLOY_TARGET || 'aws', 'onprem') && 'onprem' || (inputs.target || vars.DEPLOY_TARGET || 'aws') }}
      target-label: ${{ inputs.target || vars.DEPLOY_TARGET || 'aws' }}
      onprem-runner-label: ${{ (inputs.target || vars.DEPLOY_TARGET || 'aws') == 'onprem-secondary' && 'onprem-secondary' || 'onprem' }}
      cluster: ${{ (inputs.target || vars.DEPLOY_TARGET || 'aws') == 'aws' && 'one-tatchi' || (inputs.target || vars.DEPLOY_TARGET || 'aws') == 'gcp' && vars.GCP_CLUSTER || (inputs.target || vars.DEPLOY_TARGET || 'aws') == 'onprem-secondary' && (vars.ONPREM_SECONDARY_CLUSTER || 'missing-onprem-secondary-cluster') || vars.ONPREM_CLUSTER || 'k3d-onetouch' }}
      ingress-group: demo-app-test
      host: yolo.onetatchi.soulee.dev  # aws만 (T2)
      # 승인자용 green 미리보기 (platform ADR 0015). aws · onprem 기본 기기에서 켠다. gcp는 platform T38
      preview-host: ${{ startsWith(inputs.target || vars.DEPLOY_TARGET || 'aws', 'onprem') && 'green-yolo-onprem.soulee.dev' || (inputs.target || vars.DEPLOY_TARGET || 'aws') == 'gcp' && 'green-yolo-gcp.onetatchi.soulee.dev' || 'green-yolo.onetatchi.soulee.dev' }}
      preview-auth: ${{ (inputs.target || vars.DEPLOY_TARGET || 'aws') != 'onprem-secondary' }}
      environment: test
      namespace: test
      services: >-
        [{"name":"demo-app-be","path":"be","values":"deploy/values-be.yaml","migration":"db/init.sql"},
         {"name":"demo-app-fe","path":"fe","values":"deploy/values-fe.yaml"}]
      # yolo와 yolo에서 머지된 main은 자동 승격 판단, 일반 main은 수동 승격.
      promote-mode: branch
      verify-observability: ${{ inputs.verify-observability || false }}
      observability-url: https://onetatchi.soulee.dev/grafana
      yolo-auto-merge: true
      chart-version: 2.17.0
      template-ref: v2.17.0
    secrets: inherit

  # test에서 만든 같은 이미지(검사한 OCI digest)를 prod에 올린다. 다시 빌드하지 않는다.
  prod:
    needs: [test, changes]
    # 수동 실행의 changes 및 test 내부 선택 job이 skipped여도 test 성공을 기준으로 평가한다.
    if: >-
      always() && !cancelled() && needs.test.result == 'success' && !inputs.verify-observability &&
      ((github.event_name == 'push' && needs.changes.result == 'success' &&
        (needs.changes.outputs.prod_common == 'true' ||
         needs.changes.outputs[startsWith(inputs.target || vars.DEPLOY_TARGET || 'aws', 'onprem') && 'onprem' || (inputs.target || vars.DEPLOY_TARGET || 'aws')] == 'true')) ||
       (github.event_name == 'workflow_dispatch' && inputs.environment != 'test')) &&
      github.ref == 'refs/heads/main'
    uses: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform/.github/workflows/deploy.yml@v2.17.0
    with:
      target: ${{ startsWith(inputs.target || vars.DEPLOY_TARGET || 'aws', 'onprem') && 'onprem' || (inputs.target || vars.DEPLOY_TARGET || 'aws') }}
      target-label: ${{ inputs.target || vars.DEPLOY_TARGET || 'aws' }}
      onprem-runner-label: ${{ (inputs.target || vars.DEPLOY_TARGET || 'aws') == 'onprem-secondary' && 'onprem-secondary' || 'onprem' }}
      cluster: ${{ (inputs.target || vars.DEPLOY_TARGET || 'aws') == 'aws' && 'one-tatchi' || (inputs.target || vars.DEPLOY_TARGET || 'aws') == 'gcp' && vars.GCP_CLUSTER || (inputs.target || vars.DEPLOY_TARGET || 'aws') == 'onprem-secondary' && (vars.ONPREM_SECONDARY_CLUSTER || 'missing-onprem-secondary-cluster') || vars.ONPREM_CLUSTER || 'k3d-onetouch' }}
      ingress-group: demo-app-prod
      host: onetatchi.soulee.dev  # aws만 (T2)
      # 승인자용 green 미리보기 (platform ADR 0015). aws · onprem 기본 기기에서 켠다. gcp는 platform T38
      preview-host: ${{ startsWith(inputs.target || vars.DEPLOY_TARGET || 'aws', 'onprem') && 'green-onprem.soulee.dev' || (inputs.target || vars.DEPLOY_TARGET || 'aws') == 'gcp' && 'green-gcp.onetatchi.soulee.dev' || 'green.onetatchi.soulee.dev' }}
      preview-auth: ${{ (inputs.target || vars.DEPLOY_TARGET || 'aws') != 'onprem-secondary' }}
      environment: prod
      namespace: prod
      services: >-
        [{"name":"demo-app-be","path":"be","values":"deploy/values-be.yaml","migration":"db/init.sql"},
         {"name":"demo-app-fe","path":"fe","values":"deploy/values-fe.yaml"}]
      promote-mode: branch
      chart-version: 2.17.0
      template-ref: v2.17.0
    secrets: inherit
