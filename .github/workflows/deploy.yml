name: deploy

# 검사 → test → prod. 본문은 one-tatchi-platform의 재사용 워크플로이고, 여기서는 입력만 넘긴다.
# - pull_request: 검사만
# - push yolo/**: 검사 → test (AI 승격 판단을 바로 실행)
# - push main:    검사 → test → prod (test 값만 바꾸면 prod 생략, 운영 승인은 compliance)
# - workflow_dispatch(main): 대상 하나(또는 all)를 골라 검사 → test → prod를 다시 실행
# push 배포 대상은 레포 변수 DEPLOY_TARGETS(쉼표 구분, 예 "aws,gcp,onprem")로 고른다. 없으면 DEPLOY_TARGET, 그것도 없으면 aws.
# 대상이 여럿이면 test를 병렬로 돌리고, 모든 대상의 test가 통과해야 prod로 간다 (platform T39, ADR-0020).
# 대상별 값과 경로 분기는 .github/scripts/deploy-targets.sh에 있다.
on:
  pull_request:
  push:
    branches: [main, "yolo/**"]
  workflow_dispatch:
    inputs:
      target:
        description: 다시 배포할 대상
        required: true
        type: choice
        options: [aws, gcp, onprem, onprem-secondary, onprem-wsl, all]
      environment:
        description: 다시 배포할 환경 (test는 test만, prod는 test 검증 후 prod)
        type: choice
        default: prod
        options: [test, prod]
      verify-observability:
        description: T17 실측 (main · test 전용, 새 green에서 검증 후 정리)
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  id-token: write   # 감사 로그(S3)용 OIDC
  packages: write   # onprem 이미지(GHCR) push

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: 배포 대상 분기 회귀 검사
        run: npm ci --prefix .github/tests --ignore-scripts && npm test --prefix .github/tests
      - name: 수동 실측 요청 확인
        env:
          VERIFY: ${{ inputs.verify-observability || false }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$VERIFY" = true ]; then
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_REF" != refs/heads/main ] || [ "$ENVIRONMENT" != test ]; then
              echo '::error::T17 verification requires workflow_dispatch on main with environment=test'
              exit 1
            fi
          fi
  # 인프라 · 템플릿 버전만 바뀌었을 때 기본 AWS 앱을 다시 배포하지 않는다.
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      common: ${{ steps.paths.outputs.common }}
      prod_common: ${{ steps.paths.outputs.prod_common }}
      aws: ${{ steps.paths.outputs.aws }}
      gcp: ${{ steps.paths.outputs.gcp }}
      onprem: ${{ steps.paths.outputs.onprem }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            common:
              - 'be/**'
              - 'fe/**'
              - 'db/**'
              - 'deploy/values-*.yaml'
            # paths-filter는 OR 매칭이다. 별도 부정 패턴 대신 extglob으로 test 값만 제외한다.
            prod_common:
              - 'be/**'
              - 'fe/**'
              - 'db/**'
              - 'deploy/values-!(*.test).yaml'
            aws:
              - 'deploy/aws/**'
            gcp:
              - 'deploy/gcp/**'
            onprem:
              - 'deploy/onprem/**'
  checks:
    uses: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform/.github/workflows/checks.yml@v2.14.0
    with:
      template-ref: v2.14.0
      node-dirs: '["be", "fe"]'
      python-dirs: '[]'
      db-init: db/init.sql
      image-dirs: '["be", "fe"]'
      iac-path: infra
    secrets: inherit

  # PR 검사가 통과하면 Slack에 "PR 준비" 알림과 머지 버튼 (T26)
  pr-ready:
    needs: checks
    if: github.event_name == 'pull_request'
    uses: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform/.github/workflows/pr-ready.yml@v2.14.0
    with:
      template-ref: v2.14.0
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  # 이번 실행의 배포 대상 matrix. job if에서는 matrix를 쓸 수 없어서 경로 분기도 여기서 한다.
  targets:
    needs: [request, changes]
    if: >-
      always() && !cancelled() && needs.request.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      test: ${{ steps.targets.outputs.test }}
      prod: ${{ steps.targets.outputs.prod }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - id: targets
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REQUESTED: ${{ inputs.target }}
          ENVIRONMENT: ${{ inputs.environment }}
          VERIFY: ${{ inputs.verify-observability || false }}
          TARGETS: ${{ vars.DEPLOY_TARGETS || vars.DEPLOY_TARGET || 'aws' }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          COMMON: ${{ needs.changes.outputs.common }}
          PROD_COMMON: ${{ needs.changes.outputs.prod_common }}
          CHANGED_AWS: ${{ needs.changes.outputs.aws }}
          CHANGED_GCP: ${{ needs.changes.outputs.gcp }}
          CHANGED_ONPREM: ${{ needs.changes.outputs.onprem }}
          GCP_CLUSTER: ${{ vars.GCP_CLUSTER }}
          ONPREM_CLUSTER: ${{ vars.ONPREM_CLUSTER }}
          ONPREM_SECONDARY_CLUSTER: ${{ vars.ONPREM_SECONDARY_CLUSTER }}
          ONPREM_WSL_CLUSTER: ${{ vars.ONPREM_WSL_CLUSTER }}
        run: bash .github/scripts/deploy-targets.sh

  test:
    needs: [checks, targets]
    if: >-
      always() && !cancelled() && needs.checks.result == 'success' && needs.targets.result == 'success' &&
      needs.targets.outputs.test != '[]'
    # 한 대상이 실패해도 나머지 대상의 test 결과는 끝까지 본다. prod는 모든 대상이 통과해야 간다.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.test) }}
    uses: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform/.github/workflows/deploy.yml@v2.14.0
    with:
      target: ${{ matrix.target }}
      target-label: ${{ matrix.label }}
      onprem-runner-label: ${{ matrix.runner }}
      cluster: ${{ matrix.cluster }}
      ingress-group: demo-app-test
      host: yolo.onetatchi.soulee.dev  # aws만 (T2)
      # 승인자용 green 미리보기 (platform ADR 0015). onprem 추가 기기(secondary · wsl)는 끈다
      preview-host: ${{ matrix.preview_test }}
      preview-auth: ${{ matrix.preview_auth }}
      environment: test
      namespace: test
      services: >-
        [{"name":"demo-app-be","path":"be","values":"deploy/values-be.yaml","migration":"db/init.sql"},
         {"name":"demo-app-fe","path":"fe","values":"deploy/values-fe.yaml"}]
      # yolo와 yolo에서 머지된 main은 자동 승격 판단, 일반 main은 수동 승격.
      promote-mode: branch
      verify-observability: ${{ inputs.verify-observability || false }}
      observability-url: https://onetatchi.soulee.dev/grafana
      # 대상이 여럿이면 yolo 리포트 · main PR은 기준 대상(첫 대상)에서만 만든다.
      yolo-auto-merge: ${{ matrix.primary }}
      chart-version: 2.14.0
      template-ref: v2.14.0
    secrets: inherit

  # test에서 만든 같은 이미지(검사한 OCI digest)를 prod에 올린다. 다시 빌드하지 않는다.
  # needs.test는 모든 대상의 test가 성공해야 성공이다. 한 대상이라도 실패하면 어느 대상도 prod로 가지 않는다.
  prod:
    needs: [targets, test]
    if: >-
      always() && !cancelled() && needs.test.result == 'success' && needs.targets.outputs.prod != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.prod) }}
    uses: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform/.github/workflows/deploy.yml@v2.14.0
    with:
      target: ${{ matrix.target }}
      target-label: ${{ matrix.label }}
      onprem-runner-label: ${{ matrix.runner }}
      cluster: ${{ matrix.cluster }}
      ingress-group: demo-app-prod
      host: onetatchi.soulee.dev  # aws만 (T2)
      # 승인자용 green 미리보기 (platform ADR 0015). onprem 추가 기기(secondary · wsl)는 끈다
      preview-host: ${{ matrix.preview_prod }}
      preview-auth: ${{ matrix.preview_auth }}
      environment: prod
      namespace: prod
      services: >-
        [{"name":"demo-app-be","path":"be","values":"deploy/values-be.yaml","migration":"db/init.sql"},
         {"name":"demo-app-fe","path":"fe","values":"deploy/values-fe.yaml"}]
      promote-mode: branch
      chart-version: 2.14.0
      template-ref: v2.14.0
    secrets: inherit
