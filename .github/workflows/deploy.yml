name: deploy

# 검사 → test → prod. 본문은 one-tatchi-platform의 재사용 워크플로이고, 여기서는 입력만 넘긴다.
# - pull_request: 검사만
# - push yolo/**: 검사 → test
# - push main:    검사 → test → prod (prod는 environment 승인)
on:
  pull_request:
  push:
    branches: [main, "yolo/**"]

permissions:
  contents: read
  id-token: write   # 감사 로그(S3)용 OIDC
  packages: write   # onprem 이미지(GHCR) push

jobs:
  checks:
    uses: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform/.github/workflows/checks.yml@v1.4.0
    with:
      node-dirs: '["be", "fe"]'
      db-init: db/init.sql
      image-dirs: '["be", "fe"]'
      iac-path: infra

  test:
    needs: checks
    if: github.event_name == 'push'
    uses: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform/.github/workflows/deploy.yml@v1.4.0
    with:
      target: onprem
      cluster: k3d-onetouch
      environment: test
      namespace: test
      services: >-
        [{"name":"demo-app-be","path":"be","values":"deploy/values-be.yaml","migration":"db/init.sql"},
         {"name":"demo-app-fe","path":"fe","values":"deploy/values-fe.yaml"}]
      chart-version: 1.4.0
      template-ref: v1.4.0
    secrets: inherit

  # test에서 만든 같은 이미지(같은 커밋 SHA 태그)를 prod에 올린다.
  prod:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform/.github/workflows/deploy.yml@v1.4.0
    with:
      target: onprem
      cluster: k3d-onetouch
      environment: prod
      namespace: prod
      services: >-
        [{"name":"demo-app-be","path":"be","values":"deploy/values-be.yaml","migration":"db/init.sql"},
         {"name":"demo-app-fe","path":"fe","values":"deploy/values-fe.yaml"}]
      chart-version: 1.4.0
      template-ref: v1.4.0
    secrets: inherit
