name: deploy

# 검사 → test → prod. 본문은 one-tatchi-platform의 재사용 워크플로이고, 여기서는 입력만 넘긴다.
# - pull_request: 검사만
# - push yolo/**: 검사 → test (AI 승격 판단을 바로 실행)
# - push main:    검사 → test → prod (prod 승인 여부는 .deploy/config.yaml의 compliance)
# - workflow_dispatch(main): 대상 하나를 골라 검사 → test → prod를 다시 실행
# push 배포 대상은 레포 변수 DEPLOY_TARGET(aws | gcp | onprem, 기본 onprem)으로 고른다.
on:
  pull_request:
  push:
    branches: [main, "yolo/**"]
  workflow_dispatch:
    inputs:
      target:
        description: 다시 배포할 대상
        required: true
        type: choice
        options: [aws, gcp, onprem, onprem-secondary]
      environment:
        description: 다시 배포할 환경 (test는 test만, prod는 test 검증 후 prod)
        type: choice
        default: prod
        options: [test, prod]

permissions:
  contents: read
  pull-requests: read
  id-token: write   # 감사 로그(S3)용 OIDC
  packages: write   # onprem 이미지(GHCR) push

jobs:
  # 인프라 · 템플릿 버전만 바뀌었을 때 기본 AWS 앱을 다시 배포하지 않는다.
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      common: ${{ steps.paths.outputs.common }}
      aws: ${{ steps.paths.outputs.aws }}
      gcp: ${{ steps.paths.outputs.gcp }}
      onprem: ${{ steps.paths.outputs.onprem }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            common:
              - 'be/**'
              - 'fe/**'
              - 'db/**'
              - 'deploy/values-*.yaml'
            aws:
              - 'deploy/aws/**'
            gcp:
              - 'deploy/gcp/**'
            onprem:
              - 'deploy/onprem/**'
  checks:
    uses: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform/.github/workflows/checks.yml@v2.0.0
    with:
      template-ref: v2.0.0
      node-dirs: '["be", "fe"]'
      python-dirs: '[]'
      db-init: db/init.sql
      image-dirs: '["be", "fe"]'
      iac-path: infra

  # PR 검사가 통과하면 Slack에 "PR 준비" 알림과 머지 버튼 (T26)
  pr-ready:
    needs: checks
    if: github.event_name == 'pull_request'
    uses: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform/.github/workflows/pr-ready.yml@v2.0.0
    with:
      template-ref: v2.0.0
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  test:
    needs: [checks, changes]
    if: >-
      always() && !cancelled() && needs.checks.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' &&
        (needs.changes.outputs.common == 'true' ||
         needs.changes.outputs[startsWith(inputs.target || vars.DEPLOY_TARGET || 'onprem', 'onprem') && 'onprem' || (inputs.target || vars.DEPLOY_TARGET || 'onprem')] == 'true')))
    uses: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform/.github/workflows/deploy.yml@v2.0.0
    with:
      target: ${{ startsWith(inputs.target || vars.DEPLOY_TARGET || 'onprem', 'onprem') && 'onprem' || (inputs.target || vars.DEPLOY_TARGET || 'onprem') }}
      target-label: ${{ inputs.target || vars.DEPLOY_TARGET || 'onprem' }}
      onprem-runner-label: ${{ (inputs.target || vars.DEPLOY_TARGET || 'onprem') == 'onprem-secondary' && 'onprem-secondary' || 'onprem' }}
      cluster: ${{ (inputs.target || vars.DEPLOY_TARGET || 'onprem') == 'aws' && 'one-tatchi' || (inputs.target || vars.DEPLOY_TARGET || 'onprem') == 'gcp' && vars.GCP_CLUSTER || (inputs.target || vars.DEPLOY_TARGET || 'onprem') == 'onprem-secondary' && (vars.ONPREM_SECONDARY_CLUSTER || 'missing-onprem-secondary-cluster') || vars.ONPREM_CLUSTER || 'k3d-onetouch' }}
      ingress-group: demo-app-test
      host: yolo.onetatchi.soulee.dev  # aws만 (T2)
      environment: test
      namespace: test
      services: >-
        [{"name":"demo-app-be","path":"be","values":"deploy/values-be.yaml","migration":"db/init.sql"},
         {"name":"demo-app-fe","path":"fe","values":"deploy/values-fe.yaml"}]
      # yolo와 yolo에서 머지된 main은 자동 승격 판단, 일반 main은 수동 승격.
      promote-mode: branch
      yolo-auto-merge: true
      chart-version: 2.0.0
      template-ref: v2.0.0
    secrets: inherit

  # test에서 만든 같은 이미지(검사한 OCI digest)를 prod에 올린다. 다시 빌드하지 않는다.
  prod:
    needs: test
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment != 'test')) && github.ref == 'refs/heads/main'
    uses: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform/.github/workflows/deploy.yml@v2.0.0
    with:
      target: ${{ startsWith(inputs.target || vars.DEPLOY_TARGET || 'onprem', 'onprem') && 'onprem' || (inputs.target || vars.DEPLOY_TARGET || 'onprem') }}
      target-label: ${{ inputs.target || vars.DEPLOY_TARGET || 'onprem' }}
      onprem-runner-label: ${{ (inputs.target || vars.DEPLOY_TARGET || 'onprem') == 'onprem-secondary' && 'onprem-secondary' || 'onprem' }}
      cluster: ${{ (inputs.target || vars.DEPLOY_TARGET || 'onprem') == 'aws' && 'one-tatchi' || (inputs.target || vars.DEPLOY_TARGET || 'onprem') == 'gcp' && vars.GCP_CLUSTER || (inputs.target || vars.DEPLOY_TARGET || 'onprem') == 'onprem-secondary' && (vars.ONPREM_SECONDARY_CLUSTER || 'missing-onprem-secondary-cluster') || vars.ONPREM_CLUSTER || 'k3d-onetouch' }}
      ingress-group: demo-app-prod
      host: onetatchi.soulee.dev  # aws만 (T2)
      environment: prod
      namespace: prod
      services: >-
        [{"name":"demo-app-be","path":"be","values":"deploy/values-be.yaml","migration":"db/init.sql"},
         {"name":"demo-app-fe","path":"fe","values":"deploy/values-fe.yaml"}]
      promote-mode: branch
      chart-version: 2.0.0
      template-ref: v2.0.0
    secrets: inherit
