name: onprem-observability
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 기존 state를 사용하는 온프레미스 기기
        type: choice
        options: [secondary, default]
        default: secondary
      mode:
        description: plan은 설정을 복원하며, apply는 관측 연결만 적용
        type: choice
        options: [plan, apply]
        default: plan
permissions:
  contents: read
jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    uses: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform/.github/workflows/onprem-observability.yml@v2.2.0
    with:
      profile: ${{ inputs.profile }}
      mode: ${{ inputs.mode }}
      remote-write-url: https://metrics.onetatchi.soulee.dev/api/v1/write
      dashboard-url: https://onetatchi.soulee.dev/grafana/d/deploy-overview
      template-ref: v2.2.0
    secrets:
      OBSERVABILITY_REMOTE_WRITE_PASSWORD: ${{ secrets.OBSERVABILITY_REMOTE_WRITE_PASSWORD }}
