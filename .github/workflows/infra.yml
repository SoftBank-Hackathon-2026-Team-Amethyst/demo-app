name: infra

# 변경한 환경 루트만 plan/apply한다. GCP 변경으로 AWS를 실행하지 않는다.
on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      aws: ${{ steps.paths.outputs.aws }}
      gcp: ${{ steps.paths.outputs.gcp }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            aws:
              - 'infra/envs/aws/**'
            gcp:
              - 'infra/envs/gcp/**'
  aws:
    needs: changes
    if: needs.changes.outputs.aws == 'true'
    concurrency:
      group: infra-aws
      cancel-in-progress: false
    uses: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform/.github/workflows/infra.yml@v1.13.1
    with:
      working-directory: infra/envs/aws
      cluster: one-tatchi
      mode: ${{ github.event_name == 'push' && 'apply' || 'plan' }}
      template-ref: v1.13.1
    secrets: inherit
  gcp:
    needs: changes
    if: needs.changes.outputs.gcp == 'true'
    concurrency:
      group: infra-gcp
      cancel-in-progress: false
    uses: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform/.github/workflows/infra.yml@v1.13.1
    with:
      target: gcp
      working-directory: infra/envs/gcp
      cluster: one-tatchi-gcp
      mode: ${{ github.event_name == 'push' && 'apply' || 'plan' }}
      template-ref: v1.13.1
    secrets: inherit
